<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신호등 방향 매칭 게임</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- 공통 상단 영역 -->
        <header>
            <div class="stats">
                최고 점수: <span id="ui-best-score">0</span>
            </div>
            <div class="controls">
                <label><input type="checkbox" id="mute-toggle"> 🔇 음소거</label>
                <label><input type="checkbox" id="motion-toggle"> 🔕 움직임 줄이기</label>
            </div>
        </header>

        <!-- 1. 시작 화면 -->
        <div id="screen-start" class="screen active">
            <h1>방향 매칭 게임</h1>
            <p>화면에 나타나는 화살표 방향과 똑같은 <b>키보드 방향키(↑, ↓, ←, →)</b>를 누르세요.<br>
            제한 시간 30초 내에 목표 점수에 도달하면 성공, 3번 틀리면 실패합니다.</p>
            <button id="btn-start">게임 시작</button>
        </div>

        <!-- 2. 게임 진행 화면 -->
        <div id="screen-playing" class="screen">
            <div id="timer-bar-container">
                <div id="timer-bar"></div>
            </div>
            <div id="prompt-arrow">⬆️</div>
            <div class="hud">
                <div class="text-success">현재 점수: <span id="ui-score">0</span> / 20</div>
                <div class="text-danger">실수: <span id="ui-mistakes">0</span> / 3</div>
            </div>
        </div>

        <!-- 3. 결과 화면 (수정됨: 자동 저장 및 버튼 변경) -->
        <div id="screen-gameover" class="screen">
            <h1 id="result-title">게임 오버</h1>
            <p id="result-desc"></p>
            
            <button id="btn-view-records" style="background-color: #10b981; margin-top: 20px;">📊 내 20회 기록 보기</button>
            <button id="btn-restart" style="background-color: #64748b; margin-top: 10px;">다시 시작 (초기화)</button>
        </div>

        <!-- 4. 기록 화면 (수정됨) -->
        <div id="screen-ranking" class="screen">
            <h1>📊 최근 플레이 기록</h1>
            <p style="font-size: 0.9rem;">최대 20회까지 자동으로 보존됩니다.</p>
            <ul id="ranking-list">
                <!-- 자바스크립트로 리스트 렌더링 -->
            </ul>
            <button id="btn-back-to-start">처음으로 돌아가기</button>
        </div>

        <!-- 일시정지 화면 -->
        <div id="pause-overlay">
            <h2>일시 정지됨</h2>
            <p>화면을 클릭하면 다시 시작합니다.</p>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
