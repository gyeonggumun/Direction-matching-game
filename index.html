<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신호등 방향 매칭 게임</title>
    
    <!-- 💡 추가됨: 파비콘 404 에러 방지 및 브라우저 탭 아이콘(신호등) 설정 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚦</text></svg>">
    
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="intro-overlay" class="intro-overlay">
        <div class="intro-content">
            <p class="intro-text">
                플레이어는 <strong>키보드 방향키</strong>를 조작해<br>
                시간 안에 <strong>목표 점수 20점</strong>에 도달하면 성공하고<br>
                3번 잘못 누르거나 시간이 초과하면 실패한다.
            </p>
            <p class="intro-subtext">화면을 클릭하여 계속하기</p>
            <button class="intro-btn">확인</button>
        </div>
    </div>
    <div id="game-container">
        <!-- 공통 상단 영역 -->
        <header>
            <div class="stats">
                최고 점수: <span id="ui-best-score">0</span>
            </div>
            <div class="controls">
                <label><input type="checkbox" id="mute-toggle"> 🔇 음소거</label>
                <label><input type="checkbox" id="motion-toggle"> 🔕 움직임 줄이기</label>
            </div>
        </header>

        <!-- 1. 시작 화면 -->
        <div id="screen-start" class="screen active">
            <h1>방향 매칭 게임</h1>
            <p>화면에 나타나는 화살표 방향과 똑같은 <b>키보드 방향키(↑, ↓, ←, →)</b>를 누르세요.<br>
            목표 점수 20점에 도달하면 성공, 3번 틀리면 실패합니다.</p>
            
            <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: center;">
                <button id="btn-start-easy" style="background-color: #22c55e;">쉬움 (30초)</button>
                <button id="btn-start-normal" style="background-color: #f59e0b;">보통 (20초)</button>
                <button id="btn-start-hard" style="background-color: #ef4444;">어려움 (10초)</button>
            </div>
        </div>

        <!-- 2. 게임 진행 화면 -->
        <div id="screen-playing" class="screen">
            <div id="timer-bar-container">
                <div id="timer-bar"></div>
            </div>
            <div id="prompt-arrow">▲</div>
            <div class="hud">
                <div class="text-success">현재 점수: <span id="ui-score">0</span> / 20</div>
                <div class="text-danger">실수: <span id="ui-mistakes">0</span> / 3</div>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="screen-gameover" class="screen">
            <h1 id="result-title">게임 오버</h1>
            <p id="result-desc"></p>
            
            <!-- 버튼 강제 줄바꿈 방지 및 너비 자동 조절 -->
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px; width: max-content; min-width: 280px;">
                <button id="btn-view-records" style="background-color: #10b981; margin: 0; white-space: nowrap;">📊 내 20회 기록 보기</button>
                <button id="btn-restart" style="background-color: #64748b; margin: 0; white-space: nowrap;">다시 시작 (방금 난이도)</button>
                <button id="btn-back-to-diff" style="background-color: #3b82f6; margin: 0; white-space: nowrap;">🏠 난이도 선택으로 가기</button>
            </div>
        </div>

        <!-- 4. 기록 화면 -->
        <div id="screen-ranking" class="screen">
            <h1 style="margin-bottom: 5px;">📊 최근 플레이 기록</h1>
            <p style="font-size: 0.9rem; margin-top: 0; margin-bottom: 15px;">최대 20회까지 자동으로 보존됩니다.</p>
            
            <ul id="ranking-list" style="max-height: 260px; margin: 0 0 20px 0; width: 85%;">
                <!-- 자바스크립트로 리스트 렌더링 -->
            </ul>
            
            <div style="display: flex; gap: 15px; margin-top: auto;">
                <button id="btn-clear-records" style="background-color: #ef4444;">기록 초기화</button>
                <button id="btn-back-to-start" style="background-color: #3b82f6;">처음으로 돌아가기</button>
            </div>
        </div>

        <!-- 일시정지 화면 -->
        <div id="pause-overlay">
            <h2>일시 정지됨</h2>
            <p>화면을 클릭하거나 ESC를 누르면 다시 시작합니다.</p>
            <!-- 💡 추가됨: 일시정지 타이머 표시 텍스트 -->
            <p id="ui-pause-time" style="font-size: 0.9rem; color: #cbd5e1; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- JS 메인 파일 연결 -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
